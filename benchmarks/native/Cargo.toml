[package]
name = "rabbit-rs-native-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobins = false
autoexamples = false

[dependencies]
rabbit-rs-core = { path = "../../crates/rabbit-rs-core" }

[dev-dependencies]
bytes = "1.10"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "batching"
path = "benches/batching.rs"
harness = false

[[bench]]
name = "confirm_ledger"
path = "benches/confirm_ledger.rs"
harness = false

[[bench]]
name = "ffi_conversion"
path = "benches/ffi_conversion.rs"
harness = false

[[bench]]
name = "lapin_properties"
path = "benches/lapin_properties.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "publisher_actor"
path = "benches/publisher_actor.rs"
harness = false

[[bench]]
name = "scheduler"
path = "benches/scheduler.rs"
harness = false

[[bench]]
name = "transport"
path = "benches/transport.rs"
harness = false

[features]
default = ["bench"]
bench = ["rabbit-rs-core/bench"]

[lints]
workspace = true
