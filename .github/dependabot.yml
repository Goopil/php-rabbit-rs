version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      ci:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /packages/laravel-queue
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      laravel-queue:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /crates/rabbit-rs-php
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      php-ext:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /benchmarks
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      php-benchmarks:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /benchmarks/driver-bench
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      php-driver-bench:
        patterns:
          - "*"
