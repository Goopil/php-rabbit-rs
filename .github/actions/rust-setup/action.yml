name: Rust setup
description: Install the pinned Rust 1.96 toolchain and warm the Cargo cache
inputs:
  components:
    description: Toolchain components (comma separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust 1.96
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: "1.96.0"
        components: ${{ inputs.components }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        # Share one cache namespace across all host-side jobs (they are
        # job-scoped by default, verified via the Actions caches API: ten
        # disjoint v0-rust-<job> keys). The lockfile hash stays in the key,
        # so lockfile changes still invalidate.
        shared-key: rabbit-rs
