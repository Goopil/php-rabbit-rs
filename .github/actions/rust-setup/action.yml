name: Rust setup
description: Install the pinned Rust 1.98 toolchain and warm the Cargo cache
inputs:
  components:
    description: Toolchain components (comma separated)
    required: false
    default: ""
  cache-suffix:
    description: Extra key segment isolating the cache namespace (e.g. per PHP version)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust 1.98
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: "1.98.1"
        components: ${{ inputs.components }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        # Share one cache namespace across all host-side jobs, EXCEPT that the
        # namespace must be split per PHP version (cache-suffix). Restored
        # target/ artifacts carry ext-php-rs bindings generated against one
        # PHP module API, and cargo reuses them blindly: a PHP 8.5 job
        # restoring a PHP 8.4 job's cache rebuilds the workspace crates
        # against 8.4 bindings and produces an extension that PHP 8.5 cannot
        # load ("Module compiled with module API=20240924") — this is what
        # kept the nightly Functional matrix red in Oct-Nov 2026. The
        # lockfile hash stays in the key, so lockfile changes still invalidate.
        shared-key: rabbit-rs${{ inputs.cache-suffix }}
