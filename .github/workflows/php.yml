name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-php${{ matrix.php }}-${{ hashFiles('packages/laravel-queue/composer.json', 'packages/laravel-queue/composer.lock') }}
          restore-keys: |
            composer-php${{ matrix.php }}-
          fail-on-cache-miss: false

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Run PHPUnit tests
        run: |
          cd packages/laravel-queue
          php vendor/bin/phpunit --testdox
