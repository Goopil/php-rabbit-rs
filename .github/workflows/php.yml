name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        laravel: ["12", "13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('packages/laravel-queue/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
          fail-on-cache-miss: false

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          cd packages/laravel-queue
          rm -f composer.lock
          composer require illuminate/queue:^${{ matrix.laravel }}.0 illuminate/support:^${{ matrix.laravel }}.0 --no-update --dev
          composer update --quiet --ignore-platform-reqs

      - name: Run PHPUnit tests
        run: |
          cd packages/laravel-queue
          php vendor/bin/phpunit --testsuite="Rabbit RS Laravel" --testdox

  phpt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            php:${{ matrix.php }}-cli \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl gcc make
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              . "$HOME/.cargo/env"
              cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              ./scripts/test-extension.sh
            '

  zts-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in Docker (ZTS)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            php:8.4-zts \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl gcc make
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              . "$HOME/.cargo/env"
              cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              ./scripts/test-extension.sh
            '
