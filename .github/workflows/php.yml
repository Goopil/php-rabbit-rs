name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        laravel: ["12", "13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('packages/laravel-queue/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
          fail-on-cache-miss: false

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          cd packages/laravel-queue
          rm -f composer.lock
          composer require illuminate/queue:^${{ matrix.laravel }}.0 illuminate/support:^${{ matrix.laravel }}.0 --no-update --dev
          composer update --quiet --ignore-platform-reqs

      - name: Run PHPUnit tests
        run: |
          cd packages/laravel-queue
          php vendor/bin/phpunit --testsuite="Rabbit RS Laravel" --testdox

  phpt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build extension (release)
        run: cargo build --release --manifest crates/rabbit-rs-php/Cargo.toml

      - name: Run PHPT tests
        run: ./scripts/test-extension.sh

  zts-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 (ZTS attempt)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: json
        env:
          TS: zts

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build extension (ZTS attempt)
        run: cargo build --release --manifest crates/rabbit-rs-php/Cargo.toml

      - name: Run PHPT tests (ZTS)
        run: ./scripts/test-extension.sh
