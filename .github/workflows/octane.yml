name: Octane Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: octane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  octane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: json, mbstring

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build extension (release)
        run: cargo build --release --manifest crates/rabbit-rs-php/Cargo.toml

      - name: Verify extension is loaded
        run: |
          if ! php -d "extension=$(pwd)/target/release/librabbit_rs_php.so" -m 2>/dev/null | grep -q rabbit_rs; then
            echo "ERROR: ext-rabbit_rs is not loaded"
            exit 1
          fi
          echo "ext-rabbit_rs is loaded."

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Install Octane
        run: |
          cd packages/laravel-queue
          composer require laravel/octane --dev --ignore-platform-reqs || true

      - name: Run Octane lifecycle tests
        run: ./scripts/test-octane.sh
