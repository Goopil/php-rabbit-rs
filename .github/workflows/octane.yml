name: Octane Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: octane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  octane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: json, mbstring

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Install Octane
        run: |
          cd packages/laravel-queue
          composer require laravel/octane --dev --ignore-platform-reqs || true

      - name: Run Octane lifecycle tests
        run: ./scripts/test-octane.sh
