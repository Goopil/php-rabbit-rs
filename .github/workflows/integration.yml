name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh >/dev/null 2>&1; then
              echo "Lab is ready"
              exit 0
            fi
            echo "  waiting for lab... (${i}s)"
            sleep 1
          done
          echo "ERROR: lab is not ready after 120s"
          exit 1

      - name: Run Rust integration tests
        run: |
          cargo test -p rabbit-rs-core --test '*' -- --test-threads=1

      - name: Build extension in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            php:8.4-cli \
            sh -c '
              set -e
              apt-get update && apt-get install -y curl gcc make libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              . "$HOME/.cargo/env"
              cargo build --release --manifest crates/rabbit-rs-php/Cargo.toml
            '

      - name: Verify extension is loaded
        run: |
          if ! php -d "extension=$(pwd)/target/release/librabbit_rs_php.so" -m 2>/dev/null | grep -q rabbit_rs; then
            echo "ERROR: ext-rabbit_rs is not loaded"
            exit 1
          fi
          echo "ext-rabbit_rs is loaded."

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Run Laravel integration tests
        run: |
          cd packages/laravel-queue
          php -d "extension=$(pwd)/../../target/release/librabbit_rs_php.so" vendor/bin/phpunit --testsuite="Rabbit RS Integration" --testdox

      - name: Laravel comparison lab smoke
        run: |
          cd benchmarks/laravel
          if [ -f scripts/run-matrix.sh ]; then
            ./scripts/run-matrix.sh --smoke || true
          fi

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh

  chaos:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run chaos tests
        run: ./scripts/test-chaos.sh

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh
