name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh >/dev/null 2>&1; then
              echo "Lab is ready"
              exit 0
            fi
            echo "  waiting for lab... (${i}s)"
            sleep 1
          done
          echo "ERROR: lab is not ready after 120s"
          exit 1

      - name: Run Rust integration tests
        run: |
          cargo test -p rabbit-rs-core --test '*' -- --test-threads=1

      - name: Build and install extension
        run: ./scripts/install.sh --release --yes

      - name: Verify extension is loaded
        run: |
          if ! php -m 2>/dev/null | grep -q rabbit_rs; then
            echo "ERROR: ext-rabbit_rs is not loaded after install"
            exit 1
          fi
          echo "ext-rabbit_rs is loaded."

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Run Laravel integration tests
        run: |
          cd packages/laravel-queue
          php vendor/bin/phpunit --testsuite="Rabbit RS Integration" --testdox

      - name: Laravel comparison lab smoke
        run: |
          cd benchmarks/laravel
          if [ -f scripts/run-matrix.sh ]; then
            ./scripts/run-matrix.sh --smoke || true
          fi

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh
