name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh >/dev/null 2>&1; then
              echo "Lab is ready"
              exit 0
            fi
            echo "  waiting for lab... (${i}s)"
            sleep 1
          done
          echo "ERROR: lab is not ready after 120s"
          exit 1

      - name: Run Rust integration tests
        run: |
          cargo test -p rabbit-rs-core --test '*' -- --test-threads=1

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh

  chaos:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run chaos tests
        run: ./scripts/test-chaos.sh

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh
