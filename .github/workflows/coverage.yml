name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-rust:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --quiet || true

      - name: Run coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --all-targets --no-fail-fast --profile ci --lcov --output-path target/coverage/rust.lcov

      - name: Upload LCOV to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/coverage/rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/nextest/junit.xml
          flags: rust-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-php-ext:
    name: Coverage (PHP Extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - name: Build, test, and export LCOV
        run: ./scripts/coverage-php-ext.sh

      - name: Upload LCOV to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/coverage/php-ext.lcov
          flags: php-ext
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-laravel:
    name: Coverage (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: json

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install Laravel deps
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs

      - name: Run Laravel coverage (Unit + Feature, then Integration with extension)
        run: ./scripts/coverage-laravel.sh

      - name: Run benchmark metric-contract tests
        run: |
          composer update --quiet --working-dir=benchmarks --ignore-platform-req=ext-rabbit_rs
          composer test --working-dir=benchmarks

      - name: Upload Clover to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/clover.xml
          flags: laravel
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/junit.xml
          flags: laravel-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Integration Clover to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/clover-integration.xml
          flags: laravel-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Integration JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/junit-integration.xml
          flags: laravel-integration-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
