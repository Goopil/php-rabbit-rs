name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-rust:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --quiet || true

      - name: Run coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --all-targets --no-fail-fast --profile ci --lcov --output-path target/coverage/rust.lcov

      - name: Upload LCOV to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/coverage/rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/nextest/junit.xml
          flags: rust-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-php-ext:
    name: Coverage (PHP Extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev jq

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --quiet || true

      - name: Build extension with coverage
        run: |
          RUSTFLAGS="-Cinstrument-coverage -Clink-dead-code" \
            cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Install PHP extension deps
        run: |
          cd crates/rabbit-rs-php
          composer update --no-interaction --no-security-blocking

      - name: Run Pest tests
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/target/debug/rabbit-rs-php-%p.profraw"
        run: |
          mkdir -p target/coverage
          export RABBIT_RS_EXPECTED_VERSION="$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "rabbit-rs-php") | .version')"
          cd crates/rabbit-rs-php
          php -d extension=${{ github.workspace }}/target/debug/librabbit_rs_php.so vendor/bin/pest

      - name: Merge profraw files
        run: |
          cargo llvm-cov --no-run --lcov --output-path /dev/null 2>/dev/null || true
          LLVM_PROFDATA="$(dirname "$(find ~/.rustup -name llvm-profdata -type f | head -1)")"
          "${LLVM_PROFDATA}/llvm-profdata" merge -sparse \
            target/debug/rabbit-rs-php-*.profraw \
            -o target/coverage/php-ext.profdata

      - name: Export LCOV
        run: |
          LLVM_COV="$(dirname "$(find ~/.rustup -name llvm-cov -type f | head -1)")"
          "${LLVM_COV}/llvm-cov" export \
            target/debug/librabbit_rs_php.so \
            -instr-profile=target/coverage/php-ext.profdata \
            --format lcov \
            --ignore-filename-regex='rabbit-rs-core' \
            > target/coverage/php-ext.lcov

      - name: Upload LCOV to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: target/coverage/php-ext.lcov
          flags: php-ext
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-laravel:
    name: Coverage (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: json

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install Laravel deps
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs

      - name: Run Laravel coverage (Unit + Feature, then Integration with extension)
        run: ./scripts/coverage-laravel.sh

      - name: Upload Clover to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/clover.xml
          flags: laravel
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/junit.xml
          flags: laravel-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Integration Clover to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/clover-integration.xml
          flags: laravel-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Integration JUnit to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: packages/laravel-queue/build/junit-integration.xml
          flags: laravel-integration-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
