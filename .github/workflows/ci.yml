name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast

  clippy-sarif:
    name: Clippy SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Install clippy-sarif
        run: cargo install clippy-sarif --locked --quiet || true

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings > clippy.json || true

      - name: Convert to SARIF
        run: |
          cat clippy.json | clippy-sarif > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: results.sarif
          category: clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --quiet || true

      - name: Run cargo-deny
        run: cargo deny check

  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        laravel: ["12", "13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('packages/laravel-queue/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
          fail-on-cache-miss: false

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          cd packages/laravel-queue
          rm -f composer.lock
          composer require illuminate/queue:^${{ matrix.laravel }}.0 illuminate/support:^${{ matrix.laravel }}.0 --no-update
          composer update --quiet --ignore-platform-reqs # sonar:no-lock CI matrix test — intentional

      - name: Run Pest tests
        run: ./scripts/test-laravel.sh

  php-analysis:
    name: Pint + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-analysis-${{ hashFiles('packages/laravel-queue/composer.lock') }}
          restore-keys: |
            composer-analysis-

      - name: Install dependencies
        run: cd packages/laravel-queue && composer install --quiet --ignore-platform-reqs

      - name: Pint (style)
        run: cd packages/laravel-queue && composer lint

      - name: PHPStan (level 6)
        run: cd packages/laravel-queue && composer analyse

  phpt:
    name: PHPT (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Rust and Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo-registry
            .cargo-git
            .rustup-home
            target
            crates/rabbit-rs-php/vendor
          key: phpt-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', 'crates/rabbit-rs-php/composer.json') }}
          restore-keys: |
            phpt-${{ matrix.php }}-

      - name: Build and test in Docker
        run: |
          mkdir -p .cargo-registry .cargo-git .rustup-home
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/.cargo-registry:/root/.cargo/registry" \
            -v "${{ github.workspace }}/.cargo-git:/root/.cargo/git" \
            -v "${{ github.workspace }}/.rustup-home:/root/.rustup" \
            -w /src \
            php:${{ matrix.php }}-cli \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl gcc make unzip git

              if ! command -v cargo &>/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              fi
              . "$HOME/.cargo/env"

              if ! command -v composer &>/dev/null; then
                curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              fi

              cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests
              ./scripts/test-extension.sh
            '

  octane:
    name: Octane lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json, mbstring

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs # sonar:no-lock CI matrix test — intentional

      - name: Install Octane
        run: |
          cd packages/laravel-queue
          composer require laravel/octane --dev --ignore-platform-reqs || true # sonar:no-lock CI matrix test — intentional

      - name: Run Octane lifecycle tests
        run: ./scripts/test-octane.sh

  integration:
    name: Integration + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Build PHP extension
        run: cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs # sonar:no-lock CI matrix test — intentional

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: Run Rust integration tests
        # tls_integration runs in its own step below against the with-tls lab
        # profile (it needs the TLS + mTLS nodes and the generated certs).
        run: cargo nextest run -p rabbit-rs-core --test '*' --features integration -j 1 --no-fail-fast -E 'not binary(tls_integration)'

      - name: Run Laravel integration suite
        run: ./scripts/test-integration.sh

      - name: Run TLS integration suite (PR-blocking)
        run: |
          # Fresh lab with the TLS profile: regenerates the lab certs, boots
          # the TLS node and the client-cert-mandatory mTLS node.
          ./scripts/lab-up.sh with-tls

          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh; then
              echo "Lab is ready."
              break
            fi
            if [[ "${i}" == 120 ]]; then
              echo "Lab did not become ready after 120s." >&2
              exit 1
            fi
            sleep 1
          done

          # The SAN-negative test connects to a hostname that resolves to the
          # TLS node but is absent from its certificate SANs.
          sudo sh -c 'echo "127.0.0.1 wrong.internal" >> /etc/hosts'

          for i in $(seq 1 60); do
            if echo | openssl s_client -connect localhost:5674 -servername rabbit.internal \
                -CAfile lab/rabbitmq/tls/generated/lab-ca.pem \
                -cert lab/rabbitmq/tls/generated/lab-client.pem \
                -key lab/rabbitmq/tls/generated/lab-client.key 2>/dev/null \
                | grep -q "Verify return code: 0 (ok)"; then
              echo "mTLS listener on localhost:5674 is ready."
              break
            fi
            if [[ "${i}" == 60 ]]; then
              echo "mTLS listener on localhost:5674 did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          cargo nextest run -p rabbit-rs-core --test tls_integration --features integration -j 1 --no-fail-fast

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh

  docs:
    name: Docs coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check docs coherence
        run: ./scripts/check-docs.sh

  octane-runtime:
    name: Octane runtime (RoadRunner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo-registry
            .cargo-git
            .rustup-home
            target
          key: octane-runtime-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            octane-runtime-

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl

      - name: Build PHP extension
        run: cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Run real-server Octane certification (RoadRunner)
        run: ./scripts/test-octane-runtime.sh --server=roadrunner

  fpm:
    name: FPM certification (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The extension is built inside the php:fpm container (same PHP ABI),
      # so the Rust cache lives in workspace-relative paths like the phpt job.
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo-registry
            .cargo-git
            .rustup-home
            target
          key: fpm-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fpm-${{ matrix.php }}-

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: Run FPM certification in Docker
        run: |
          mkdir -p .cargo-registry .cargo-git .rustup-home
          # The certification script runs inside the php:fpm container and
          # reaches the lab through the host-gateway alias: the lab's AMQP
          # (5672) and management (15672) ports are published on the runner.
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/.cargo-registry:/root/.cargo/registry" \
            -v "${{ github.workspace }}/.cargo-git:/root/.cargo/git" \
            -v "${{ github.workspace }}/.rustup-home:/root/.rustup" \
            -e RABBIT_RS_FPM_EXTERNAL_LAB=1 \
            -e RABBIT_RS_FPM_BROKER_HOST=host.docker.internal \
            -e RABBIT_RS_FPM_MGMT_BASE=http://host.docker.internal:15672 \
            -w /src \
            php:${{ matrix.php }}-fpm \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl jq git

              if ! command -v cargo &>/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              fi
              . "$HOME/.cargo/env"

              cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests
              ./scripts/test-fpm.sh
            '

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh


