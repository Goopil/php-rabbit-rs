name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast

  clippy-sarif:
    name: Clippy SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install clippy-sarif
        run: cargo install clippy-sarif --locked --quiet || true

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings > clippy.json || true

      - name: Convert to SARIF
        run: |
          cat clippy.json | clippy-sarif > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          sarif_file: results.sarif
          category: clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --quiet || true

      - name: Run cargo-deny
        run: cargo deny check

  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        laravel: ["12", "13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/laravel-queue/vendor
            ~/.cache/composer
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('packages/laravel-queue/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
          fail-on-cache-miss: false

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          cd packages/laravel-queue
          rm -f composer.lock
          composer require illuminate/queue:^${{ matrix.laravel }}.0 illuminate/support:^${{ matrix.laravel }}.0 --no-update
          composer update --quiet --ignore-platform-reqs

      - name: Run Pest tests
        run: ./scripts/test-laravel.sh

  phpt:
    name: PHPT (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Rust and Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo-registry
            .cargo-git
            .rustup-home
            target
            crates/rabbit-rs-php/vendor
          key: phpt-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', 'crates/rabbit-rs-php/composer.json') }}
          restore-keys: |
            phpt-${{ matrix.php }}-

      - name: Build and test in Docker
        run: |
          mkdir -p .cargo-registry .cargo-git .rustup-home
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/.cargo-registry:/root/.cargo/registry" \
            -v "${{ github.workspace }}/.cargo-git:/root/.cargo/git" \
            -v "${{ github.workspace }}/.rustup-home:/root/.rustup" \
            -w /src \
            php:${{ matrix.php }}-cli \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl gcc make unzip git

              if ! command -v cargo &>/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              fi
              . "$HOME/.cargo/env"

              if ! command -v composer &>/dev/null; then
                curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              fi

              cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests
              ./scripts/test-extension.sh
            '

  zts:
    name: ZTS build (8.4)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Rust and Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo-registry
            .cargo-git
            .rustup-home
            target
            crates/rabbit-rs-php/vendor
          key: zts-8.4-${{ hashFiles('**/Cargo.lock', 'crates/rabbit-rs-php/composer.json') }}
          restore-keys: |
            zts-8.4-

      - name: Build and test in Docker (ZTS)
        run: |
          mkdir -p .cargo-registry .cargo-git .rustup-home
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/.cargo-registry:/root/.cargo/registry" \
            -v "${{ github.workspace }}/.cargo-git:/root/.cargo/git" \
            -v "${{ github.workspace }}/.rustup-home:/root/.rustup" \
            -w /src \
            php:8.4-zts \
            sh -c '
              set -e
              apt-get update -qq && apt-get install -y -qq libclang-dev curl gcc make unzip git

              if ! command -v cargo &>/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
              fi
              . "$HOME/.cargo/env"

              if ! command -v composer &>/dev/null; then
                curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              fi

              cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests
              ./scripts/test-extension.sh
            '

  octane:
    name: Octane lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json, mbstring

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs

      - name: Install Octane
        run: |
          cd packages/laravel-queue
          composer require laravel/octane --dev --ignore-platform-reqs || true

      - name: Run Octane lifecycle tests
        run: |
          cd packages/laravel-queue
          php vendor/bin/pest tests/Feature --filter="Octane" --testdox

  integration:
    name: Integration + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --quiet || true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Build PHP extension
        run: cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer update --quiet --ignore-platform-reqs

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: Run Rust integration tests
        run: cargo nextest run -p rabbit-rs-core --test '*' -j 1 --no-fail-fast

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh

