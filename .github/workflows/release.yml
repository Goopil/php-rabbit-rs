name: Release Pipeline

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default; jobs raise only the scopes they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_packagist: ${{ steps.check-secrets.outputs.has_packagist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Packagist token
        id: check-secrets
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Verify Laravel package ext-rabbit_rs constraint matches version policy
        run: |
          CONSTRAINT=$(sed -n 's/.*"ext-rabbit_rs": *"\([^"]*\)".*/\1/p' packages/laravel-queue/composer.json)
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [[ "$CARGO_VERSION" == 0.0.* ]]; then
            EXPECTED="^0.0"
          else
            EXPECTED="^${CARGO_VERSION%%.*}.0"
          fi
          if [[ "$CONSTRAINT" != "$EXPECTED" ]]; then
            echo "::error::Laravel package ext-rabbit_rs constraint ($CONSTRAINT) does not match the extension version policy ($EXPECTED, derived from Cargo.toml $CARGO_VERSION)."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Rabbit RS $GITHUB_REF_NAME" --generate-notes --repo "${GITHUB_REPOSITORY}"

  build-linux:
    needs: create-release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        arch: ["x86_64", "arm64"]
        ts: ["nts"]
        libc: ["glibc", "musl"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Docker image
        id: docker
        env:
          PHP: ${{ matrix.php }}
          LIBC: ${{ matrix.libc }}
        run: |
          # Digest-pinned multi-arch indexes (linux/amd64 + linux/arm64) so a
          # base-image push cannot change the shipped toolchain. Each index
          # serves both matrix arches. Bump deliberately: re-resolve the tag
          # with `docker buildx imagetools inspect php:<tag>` and replace one
          # line, or the case arm fails loudly on a new matrix cell.
          case "${PHP}-${LIBC}" in
            "8.4-glibc") image='php@sha256:a545b9041fb0e378cb597b4d0509f77c6a4d996dd485763af92e5b7e59c469cc' ;;
            "8.5-glibc") image='php@sha256:9ebdf4c28ab12c02085e171c31e22ac5f7bbb6a9f6927e3bc3dfe7ee23df51e0' ;;
            "8.4-musl") image='php@sha256:2f389f933c3cc58cc622bd243bb4ecff7e6553e2de4387a239bca640c988be19' ;;
            "8.5-musl") image='php@sha256:763e2dc50d4b0cf8d02a1d8fbeedd43f9be879c0be928b1d6f247d45c81fa28f' ;;
            *) echo "::error::No pinned base image for PHP ${PHP} (${LIBC}). Add a digest to the map above."; exit 1 ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-

      - name: Build and smoke test in Docker
        env:
          LIBC: ${{ matrix.libc }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e LIBC \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              if [ "$LIBC" = "musl" ]; then
                apk add --no-cache curl gcc g++ make pkgconfig clang-dev musl-dev linux-headers
                RUSTUP_FLAGS="--default-toolchain stable --profile minimal"
              else
                apt-get update && apt-get install -y curl gcc make libclang-dev
                RUSTUP_FLAGS=""
              fi
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y $RUSTUP_FLAGS
              . "$HOME/.cargo/env"
              cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
              if [ "$LIBC" = "musl" ]; then
                RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              else
                cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              fi
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
              cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
              cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json /src/rabbit_rs.sbom.json
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\\n\";
              "
            '

      - name: Package, upload, and attest
        uses: ./.github/actions/package-release-asset
        with:
          # Unified PIE naming convention: every Linux artifact carries an
          # explicit thread-safety suffix (-nts in V1 — the matrix is
          # NTS-only, see docs/distribution.md and scripts/validate-distribution.sh).
          asset-base: php_rabbit_rs-v${{ needs.create-release.outputs.version }}_php${{ matrix.php }}-${{ matrix.arch }}-linux-${{ matrix.libc }}-${{ matrix.ts }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-macos-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-release-macos-${{ matrix.php }}-

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet

      - name: Build extension
        run: |
          cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
          cp target/release/librabbit_rs_php.dylib rabbit_rs.so

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
          cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json rabbit_rs.sbom.json

      - name: Smoke test
        run: |
          php -d extension=$(pwd)/rabbit_rs.so -r "
            if (!extension_loaded('rabbit_rs')) {
              echo \"ERROR: rabbit_rs extension is not loaded\n\";
              exit(1);
            }
            echo \"OK: rabbit_rs loaded, version \" . phpversion('rabbit_rs') . \"\n\";
          "

      - name: Package, upload, and attest
        uses: ./.github/actions/package-release-asset
        with:
          asset-base: php_rabbit_rs-v${{ needs.create-release.outputs.version }}_php${{ matrix.php }}-arm64-darwin-nts
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    needs: [create-release, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify release assets and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -e
          ASSETS_JSON="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")"
          ASSET_COUNT="$(echo "${ASSETS_JSON}" | wc -l | tr -d ' ')"

          echo "Found ${ASSET_COUNT} assets:"
          echo "${ASSETS_JSON}"

          if [[ "${ASSET_COUNT}" -ne 30 ]]; then
            echo "::error::Expected 30 assets (10 ZIP + 10 SHA256 + 10 SBOM), found ${ASSET_COUNT}"
            exit 1
          fi

          ZIP_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.zip$')"
          SHA_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sha256$')"
          SBOM_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sbom\.json$')"
          [[ "${ZIP_COUNT}" -eq 10 ]] || { echo "::error::Expected 10 ZIPs, found ${ZIP_COUNT}"; exit 1; }
          [[ "${SHA_COUNT}" -eq 10 ]] || { echo "::error::Expected 10 SHA256, found ${SHA_COUNT}"; exit 1; }
          [[ "${SBOM_COUNT}" -eq 10 ]] || { echo "::error::Expected 10 SBOMs, found ${SBOM_COUNT}"; exit 1; }

          # Verify every ZIP has matching SHA256 and SBOM
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            base="${zip%.zip}"
            echo "${ASSETS_JSON}" | grep -q "${zip}.sha256" \
              || { echo "::error::Missing SHA256 for ${zip}"; exit 1; }
            echo "${ASSETS_JSON}" | grep -q "${base}.sbom.json" \
              || { echo "::error::Missing SBOM for ${zip}"; exit 1; }
          done

          # Download each ZIP to verify attestations (gh attestation verify needs the file)
          mkdir -p /tmp/assets
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            gh release download "$GITHUB_REF_NAME" --pattern "${zip}" --dir /tmp/assets --clobber --repo "${GITHUB_REPOSITORY}"
          done

          # Verify all attestations (provenance + SBOM) for each ZIP subject.
          # Both attestations have the ZIP as subject; gh attestation verify
          # without --predicate-type checks every attestation for the subject.
          for zip in /tmp/assets/*.zip; do
            name="$(basename "${zip}")"
            echo "==> Verifying attestations for ${name}"
            gh attestation verify "${zip}" \
              --repo "${GITHUB_REPOSITORY}" \
              || { echo "::error::Attestation verification failed for ${name}"; exit 1; }
          done

          echo "OK: 10 ZIPs + 10 SHA256 + 10 SBOMs verified"
          echo "OK: 10 provenance + 10 SBOM attestations verified"

  verify-pie-install:
    name: PIE install end-to-end (glibc NTS x86_64 PHP 8.4)
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install PIE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PIE is pinned to a tagged release (no floating "latest") and
          # verified by sha256 before use; the attestation check below then
          # proves provenance. Bump deliberately: update the tag, recompute
          # the checksum (`shasum -a 256 pie.phar` on the tagged asset), and
          # confirm `gh attestation verify --owner php` still passes.
          curl --proto "=https" -fL --output /tmp/pie.phar https://github.com/php/pie/releases/download/1.4.10/pie.phar
          echo "b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8  /tmp/pie.phar" | sha256sum --strict --check -
          gh attestation verify --owner php /tmp/pie.phar
          sudo mv /tmp/pie.phar /usr/local/bin/pie
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Authenticate Composer for the GitHub API (release access)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "${GITHUB_TOKEN}"

      - name: Install the published release via PIE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sudo -E pie repository:add vcs "https://github.com/${GITHUB_REPOSITORY}"
          sudo -E pie install --no-interaction "goopil/rabbit-rs-native:${GITHUB_REF_NAME}"

      - name: Smoke test installed extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          php -m | grep -qx "rabbit_rs" \
            || { echo "::error::rabbit_rs is not loaded after pie install"; php -m; exit 1; }
          php -r "
            \$v = phpversion('rabbit_rs');
            if (\$v !== '${VERSION}') {
              fwrite(STDERR, \"ERROR: version mismatch - installed '\$v', expected '${VERSION}'\" . PHP_EOL);
              exit(1);
            }
            echo 'OK: rabbit_rs ' . \$v . ' installed via PIE from the published release' . PHP_EOL;
          "

  publish-release:
    needs: [create-release, build-linux, build-macos, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "${GITHUB_REPOSITORY}"

      - name: Trigger Packagist update
        if: needs.create-release.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: ./scripts/trigger-packagist-update.sh --repository https://github.com/Goopil/rabbit-rs

  update-homebrew-formula:
    needs: [create-release, publish-release, verify-pie-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check prerequisites
        id: check
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [[ -z "${MIRROR_TOKEN}" ]]; then
            echo "::warning::MIRROR_TOKEN secret is not configured -- skipping Homebrew formula update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew formula
        if: steps.check.outputs.skip == 'false'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: ./scripts/update-homebrew-formula.sh --version "${VERSION}"

      - name: Summary
        if: steps.check.outputs.skip == 'true'
        run: echo "::notice::MIRROR_TOKEN not configured -- Homebrew formula update skipped."

  split-laravel:
    needs: [publish-release, verify-pie-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check prerequisites
        id: check
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -z "${MIRROR_TOKEN}" ]]; then
            echo "::warning::MIRROR_TOKEN secret is not configured — skipping push to mirror"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split Laravel package
        run: |
          ./scripts/split-laravel-package.sh --output /tmp/laravel-split

      - name: Push to mirror repository
        if: steps.check.outputs.skip == 'false'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd /tmp/laravel-split
          git init -b main
          git config user.name "rabbit-rs-ci"
          git config user.email "ci@rabbit-rs.local"
          git add -A
          git commit -m "Release ${GITHUB_REF_NAME}"

          # The token is supplied through GIT_ASKPASS so it never lands in the
          # remote URL, .git/config, or process listings.
          askpass="$(mktemp)"
          trap 'rm -f "${askpass}"' EXIT
          cat > "${askpass}" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "${MIRROR_TOKEN}"
          ASKPASS
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0

          git remote add origin "https://x-access-token@github.com/Goopil/rabbit-rs-laravel.git"

          # Never force-push the mirror: stack the split content on top of the
          # mirror's current main so the push is a fast-forward, then push
          # explicit refs. A push race or an already-published tag fails the
          # release instead of rewriting published history.
          if git fetch --depth=1 origin main; then
            git reset --soft FETCH_HEAD
          fi
          git commit -m "Release ${GITHUB_REF_NAME}" || true
          git push origin "HEAD:refs/heads/main"

          git tag "${GITHUB_REF_NAME}"
          git push origin "refs/tags/${GITHUB_REF_NAME}"

      - name: Trigger Packagist update for rabbit-rs-laravel
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: ./scripts/trigger-packagist-update.sh --repository https://github.com/Goopil/rabbit-rs-laravel

      - name: Summary
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::Split completed locally but push was skipped."
          echo "::notice::Configure MIRROR_TOKEN and PACKAGIST_TOKEN secrets to enable mirror push."
