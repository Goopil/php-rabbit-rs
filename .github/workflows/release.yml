name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_packagist: ${{ steps.check-secrets.outputs.has_packagist }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Packagist token
        id: check-secrets
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Rabbit RS $GITHUB_REF_NAME" --generate-notes

  build-linux:
    needs: create-release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        arch: ["x86_64", "arm64"]
        ts: ["nts", "zts"]
        libc: ["glibc", "musl"]
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker image
        id: docker
        run: |
          PHP="${{ matrix.php }}"
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts-alpine" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-alpine" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-cli" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build in Docker (glibc)
        if: matrix.libc == 'glibc'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apt-get update && apt-get install -y curl gcc make libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
            '

      - name: Build in Docker (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apk add --no-cache curl gcc g++ make pkgconfig clang-dev musl-dev linux-headers
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              . "$HOME/.cargo/env"
              RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
            '

      - name: Smoke test (native arch only)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\n\";
              "
            '

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TS_SUFFIX=""
          if [[ "${{ matrix.ts }}" == "zts" ]]; then
            TS_SUFFIX="-zts"
          fi
          ASSET_NAME="php_rabbit_rs-${VERSION}_php${{ matrix.php }}-${{ matrix.arch }}-linux-${{ matrix.libc }}${TS_SUFFIX}.zip"
          zip "${ASSET_NAME}" rabbit_rs.so
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET_NAME" "$ASSET_NAME.sha256" --clobber

  publish-release:
    needs: [create-release, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Trigger Packagist update
        if: needs.create-release.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -H "X-Packagist-Token: ${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs"}}'
