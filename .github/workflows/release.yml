name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_packagist: ${{ steps.check-secrets.outputs.has_packagist }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Packagist token
        id: check-secrets
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Rabbit RS $GITHUB_REF_NAME" --generate-notes --repo "${GITHUB_REPOSITORY}"

  build-linux:
    needs: create-release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        arch: ["x86_64", "arm64"]
        ts: ["nts", "zts"]
        libc: ["glibc", "musl"]
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker image
        id: docker
        run: |
          PHP="${{ matrix.php }}"
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts-alpine" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-alpine" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-cli" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-

      - name: Build and smoke test in Docker (glibc)
        if: matrix.libc == 'glibc'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apt-get update && apt-get install -y curl gcc make libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
              cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
              cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
              cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json /src/rabbit_rs.sbom.json
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\n\";
              "
            '

      - name: Build and smoke test in Docker (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apk add --no-cache curl gcc g++ make pkgconfig clang-dev musl-dev linux-headers
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              . "$HOME/.cargo/env"
              cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
              RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
              cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
              cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json /src/rabbit_rs.sbom.json
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\n\";
              "
            '

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TS_SUFFIX=""
          if [[ "${{ matrix.ts }}" == "zts" ]]; then
            TS_SUFFIX="-zts"
          fi
          ASSET_BASE="php_rabbit_rs-${VERSION}_php${{ matrix.php }}-${{ matrix.arch }}-linux-${{ matrix.libc }}${TS_SUFFIX}"
          ASSET_NAME="${ASSET_BASE}.zip"
          zip "${ASSET_NAME}" rabbit_rs.so
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

          # SBOM was generated inside the Docker build container and copied to rabbit_rs.sbom.json
          cp rabbit_rs.sbom.json "${ASSET_BASE}.sbom.json"
          [[ -f "${ASSET_BASE}.sbom.json" ]] || { echo "::error::SBOM not found"; exit 1; }

          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_BASE=${ASSET_BASE}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$ASSET_NAME" "$ASSET_NAME.sha256" "${ASSET_BASE}.sbom.json" \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'
          sbom-path: '${{ github.workspace }}/${{ env.ASSET_BASE }}.sbom.json'

  verify-release:
    needs: [create-release, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify release assets and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -e
          ASSETS_JSON="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")"
          ASSET_COUNT="$(echo "${ASSETS_JSON}" | wc -l | tr -d ' ')"

          echo "Found ${ASSET_COUNT} assets:"
          echo "${ASSETS_JSON}"

          if [[ "${ASSET_COUNT}" -ne 48 ]]; then
            echo "::error::Expected 48 assets (16 ZIP + 16 SHA256 + 16 SBOM), found ${ASSET_COUNT}"
            exit 1
          fi

          ZIP_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.zip$')"
          SHA_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sha256$')"
          SBOM_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sbom\.json$')"
          [[ "${ZIP_COUNT}" -eq 16 ]] || { echo "::error::Expected 16 ZIPs, found ${ZIP_COUNT}"; exit 1; }
          [[ "${SHA_COUNT}" -eq 16 ]] || { echo "::error::Expected 16 SHA256, found ${SHA_COUNT}"; exit 1; }
          [[ "${SBOM_COUNT}" -eq 16 ]] || { echo "::error::Expected 16 SBOMs, found ${SBOM_COUNT}"; exit 1; }

          # Verify every ZIP has matching SHA256 and SBOM
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            base="${zip%.zip}"
            echo "${ASSETS_JSON}" | grep -q "${zip}.sha256" \
              || { echo "::error::Missing SHA256 for ${zip}"; exit 1; }
            echo "${ASSETS_JSON}" | grep -q "${base}.sbom.json" \
              || { echo "::error::Missing SBOM for ${zip}"; exit 1; }
          done

          # Download each ZIP to verify attestations (gh attestation verify needs the file)
          mkdir -p /tmp/assets
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            gh release download "$GITHUB_REF_NAME" --pattern "${zip}" --dir /tmp/assets --clobber --repo "${GITHUB_REPOSITORY}"
          done

          # Verify all attestations (provenance + SBOM) for each ZIP subject.
          # Both attestations have the ZIP as subject; gh attestation verify
          # without --predicate-type checks every attestation for the subject.
          for zip in /tmp/assets/*.zip; do
            name="$(basename "${zip}")"
            echo "==> Verifying attestations for ${name}"
            gh attestation verify "${zip}" \
              --repo "${GITHUB_REPOSITORY}" \
              || { echo "::error::Attestation verification failed for ${name}"; exit 1; }
          done

          echo "OK: 16 ZIPs + 16 SHA256 + 16 SBOMs verified"
          echo "OK: 16 provenance + 16 SBOM attestations verified"

  publish-release:
    needs: [create-release, build-linux, verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "${GITHUB_REPOSITORY}"

      - name: Trigger Packagist update
        if: needs.create-release.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -H "X-Packagist-Token: ${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs"}}'
