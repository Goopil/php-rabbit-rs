name: Release Pipeline

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_packagist: ${{ steps.check-secrets.outputs.has_packagist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Packagist token
        id: check-secrets
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Verify Laravel package ext-rabbit_rs constraint matches version policy
        run: |
          CONSTRAINT=$(sed -n 's/.*"ext-rabbit_rs": *"\([^"]*\)".*/\1/p' packages/laravel-queue/composer.json)
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [[ "$CARGO_VERSION" == 0.0.* ]]; then
            EXPECTED="^0.0"
          else
            EXPECTED="^${CARGO_VERSION%%.*}.0"
          fi
          if [[ "$CONSTRAINT" != "$EXPECTED" ]]; then
            echo "::error::Laravel package ext-rabbit_rs constraint ($CONSTRAINT) does not match the extension version policy ($EXPECTED, derived from Cargo.toml $CARGO_VERSION)."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Rabbit RS $GITHUB_REF_NAME" --generate-notes --repo "${GITHUB_REPOSITORY}"

  build-linux:
    needs: create-release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        arch: ["x86_64", "arm64"]
        ts: ["nts", "zts"]
        libc: ["glibc", "musl"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Docker image
        id: docker
        run: |
          PHP="${{ matrix.php }}"
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts-alpine" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-alpine" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "image=php:${PHP}-zts" >> "$GITHUB_OUTPUT"
            else
              echo "image=php:${PHP}-cli" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-release-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.php }}-

      - name: Build and smoke test in Docker (glibc)
        if: matrix.libc == 'glibc'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apt-get update && apt-get install -y curl gcc make libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
              cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
              cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
              cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json /src/rabbit_rs.sbom.json
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\n\";
              "
            '

      - name: Build and smoke test in Docker (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ steps.docker.outputs.image }} \
            sh -c '
              set -e
              apk add --no-cache curl gcc g++ make pkgconfig clang-dev musl-dev linux-headers
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              . "$HOME/.cargo/env"
              cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
              RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              cp target/release/librabbit_rs_php.so /src/rabbit_rs.so
              cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
              cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json /src/rabbit_rs.sbom.json
              php -d extension=/src/rabbit_rs.so -r "
                if (!extension_loaded(\"rabbit_rs\")) {
                  echo \"ERROR: rabbit_rs extension is not loaded\n\";
                  exit(1);
                }
                echo \"OK: rabbit_rs loaded, version \" . phpversion(\"rabbit_rs\") . \"\n\";
              "
            '

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          # Unified PIE naming convention: every Linux artifact carries an
          # explicit thread-safety suffix (-nts / -zts). See
          # docs/distribution.md and scripts/verify-pie-naming.sh.
          ASSET_BASE="php_rabbit_rs-v${VERSION}_php${{ matrix.php }}-${{ matrix.arch }}-linux-${{ matrix.libc }}-${{ matrix.ts }}"
          ASSET_NAME="${ASSET_BASE}.zip"
          zip "${ASSET_NAME}" rabbit_rs.so
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

          # SBOM was generated inside the Docker build container and copied to rabbit_rs.sbom.json
          cp rabbit_rs.sbom.json "${ASSET_BASE}.sbom.json"
          [[ -f "${ASSET_BASE}.sbom.json" ]] || { echo "::error::SBOM not found"; exit 1; }

          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_BASE=${ASSET_BASE}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$ASSET_NAME" "$ASSET_NAME.sha256" "${ASSET_BASE}.sbom.json" \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'
          sbom-path: '${{ github.workspace }}/${{ env.ASSET_BASE }}.sbom.json'

  build-macos:
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-macos-${{ matrix.php }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-release-macos-${{ matrix.php }}-

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet

      - name: Build extension
        run: |
          cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
          cp target/release/librabbit_rs_php.dylib rabbit_rs.so

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path crates/rabbit-rs-php/Cargo.toml --format json --spec-version 1.5 --quiet
          cp crates/rabbit-rs-php/rabbit-rs-php.cdx.json rabbit_rs.sbom.json

      - name: Smoke test
        run: |
          php -d extension=$(pwd)/rabbit_rs.so -r "
            if (!extension_loaded('rabbit_rs')) {
              echo \"ERROR: rabbit_rs extension is not loaded\n\";
              exit(1);
            }
            echo \"OK: rabbit_rs loaded, version \" . phpversion('rabbit_rs') . \"\n\";
          "

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ASSET_BASE="php_rabbit_rs-v${VERSION}_php${{ matrix.php }}-arm64-darwin-nts"
          ASSET_NAME="${ASSET_BASE}.zip"
          zip "${ASSET_NAME}" rabbit_rs.so
          shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          cp rabbit_rs.sbom.json "${ASSET_BASE}.sbom.json"
          [[ -f "${ASSET_BASE}.sbom.json" ]] || { echo "::error::SBOM not found"; exit 1; }

          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_BASE=${ASSET_BASE}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$ASSET_NAME" "$ASSET_NAME.sha256" "${ASSET_BASE}.sbom.json" \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET_NAME }}'
          sbom-path: '${{ github.workspace }}/${{ env.ASSET_BASE }}.sbom.json'

  verify-release:
    needs: [create-release, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify release assets and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -e
          ASSETS_JSON="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")"
          ASSET_COUNT="$(echo "${ASSETS_JSON}" | wc -l | tr -d ' ')"

          echo "Found ${ASSET_COUNT} assets:"
          echo "${ASSETS_JSON}"

          if [[ "${ASSET_COUNT}" -ne 54 ]]; then
            echo "::error::Expected 54 assets (18 ZIP + 18 SHA256 + 18 SBOM), found ${ASSET_COUNT}"
            exit 1
          fi

          ZIP_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.zip$')"
          SHA_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sha256$')"
          SBOM_COUNT="$(echo "${ASSETS_JSON}" | grep -c '\.sbom\.json$')"
          [[ "${ZIP_COUNT}" -eq 18 ]] || { echo "::error::Expected 18 ZIPs, found ${ZIP_COUNT}"; exit 1; }
          [[ "${SHA_COUNT}" -eq 18 ]] || { echo "::error::Expected 18 SHA256, found ${SHA_COUNT}"; exit 1; }
          [[ "${SBOM_COUNT}" -eq 18 ]] || { echo "::error::Expected 18 SBOMs, found ${SBOM_COUNT}"; exit 1; }

          # Verify every ZIP has matching SHA256 and SBOM
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            base="${zip%.zip}"
            echo "${ASSETS_JSON}" | grep -q "${zip}.sha256" \
              || { echo "::error::Missing SHA256 for ${zip}"; exit 1; }
            echo "${ASSETS_JSON}" | grep -q "${base}.sbom.json" \
              || { echo "::error::Missing SBOM for ${zip}"; exit 1; }
          done

          # Download each ZIP to verify attestations (gh attestation verify needs the file)
          mkdir -p /tmp/assets
          for zip in $(echo "${ASSETS_JSON}" | grep '\.zip$'); do
            gh release download "$GITHUB_REF_NAME" --pattern "${zip}" --dir /tmp/assets --clobber --repo "${GITHUB_REPOSITORY}"
          done

          # Verify all attestations (provenance + SBOM) for each ZIP subject.
          # Both attestations have the ZIP as subject; gh attestation verify
          # without --predicate-type checks every attestation for the subject.
          for zip in /tmp/assets/*.zip; do
            name="$(basename "${zip}")"
            echo "==> Verifying attestations for ${name}"
            gh attestation verify "${zip}" \
              --repo "${GITHUB_REPOSITORY}" \
              || { echo "::error::Attestation verification failed for ${name}"; exit 1; }
          done

          echo "OK: 18 ZIPs + 18 SHA256 + 18 SBOMs verified"
          echo "OK: 18 provenance + 18 SBOM attestations verified"

  verify-pie-install:
    name: PIE install end-to-end (glibc NTS x86_64 PHP 8.4)
    needs: [create-release, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install PIE
        run: |
          curl -fL --output /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          gh attestation verify --owner php /tmp/pie.phar
          sudo mv /tmp/pie.phar /usr/local/bin/pie
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Authenticate Composer for the GitHub API (draft release access)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "${GITHUB_TOKEN}"

      - name: Install the drafted release via PIE
        run: |
          set -e
          pie repository:add vcs "https://github.com/${GITHUB_REPOSITORY}"
          pie install --no-interaction "goopil/rabbit-rs-native:${GITHUB_REF_NAME}"

      - name: Smoke test installed extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          php -m | grep -qx "rabbit_rs" \
            || { echo "::error::rabbit_rs is not loaded after pie install"; php -m; exit 1; }
          php -r "
            \$v = phpversion('rabbit_rs');
            if (\$v !== '${VERSION}') {
              fwrite(STDERR, \"ERROR: version mismatch - installed '\$v', expected '${VERSION}'\" . PHP_EOL);
              exit(1);
            }
            echo 'OK: rabbit_rs ' . \$v . ' installed via PIE from the draft release' . PHP_EOL;
          "

  publish-release:
    needs: [create-release, build-linux, build-macos, verify-release, verify-pie-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "${GITHUB_REPOSITORY}"

      - name: Trigger Packagist update
        if: needs.create-release.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=goopil&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs"}}'

  update-homebrew-formula:
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check prerequisites
        id: check
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [[ -z "${MIRROR_TOKEN}" ]]; then
            echo "::warning::MIRROR_TOKEN secret is not configured -- skipping Homebrew formula update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew formula
        if: steps.check.outputs.skip == 'false'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: ./scripts/update-homebrew-formula.sh --version "${VERSION}"

      - name: Summary
        if: steps.check.outputs.skip == 'true'
        run: echo "::notice::MIRROR_TOKEN not configured -- Homebrew formula update skipped."

  test-homebrew-formula:
    needs: [update-homebrew-formula]
    runs-on: macos-14
    permissions:
      contents: read
    if: needs.update-homebrew-formula.result == 'success' && needs.update-homebrew-formula.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Tap and audit formula
        run: |
          brew trust goopil/rabbit-rs
          brew tap goopil/rabbit-rs
          brew audit --strict --formula goopil/rabbit-rs/rabbit-rs

      - name: Install formula
        run: brew install rabbit-rs

      - name: Verify extension loads
        run: |
          $(brew --prefix php)/bin/php -m | grep -q "rabbit_rs" || { echo "ERROR: rabbit_rs extension not loaded"; exit 1; }
          echo "OK: rabbit_rs loaded, version $($(brew --prefix php)/bin/php -r 'echo phpversion("rabbit_rs");')"

      - name: Uninstall and verify cleanup
        run: |
          brew uninstall rabbit-rs
          if $(brew --prefix php)/bin/php -m 2>/dev/null | grep -q "rabbit_rs"; then
            echo "ERROR: rabbit_rs still loaded after uninstall"
            exit 1
          fi
          echo "OK: rabbit_rs uninstalled cleanly"

  split-laravel:
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check prerequisites
        id: check
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [[ -z "${MIRROR_TOKEN}" ]]; then
            echo "::warning::MIRROR_TOKEN secret is not configured — skipping push to mirror"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${PACKAGIST_TOKEN}" ]]; then
            echo "has_packagist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packagist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split Laravel package
        run: |
          ./scripts/split-laravel-package.sh --output /tmp/laravel-split

      - name: Push to mirror repository
        if: steps.check.outputs.skip == 'false'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd /tmp/laravel-split
          git init
          git config user.name "rabbit-rs-ci"
          git config user.email "ci@rabbit-rs.local"
          git checkout -b main
          git add -A
          git commit -m "Release ${GITHUB_REF_NAME}"
          git remote add origin "https://${MIRROR_TOKEN}@github.com/Goopil/rabbit-rs-laravel.git"
          git push origin main --force

      - name: Tag the mirror
        if: steps.check.outputs.skip == 'false'
        run: |
          cd /tmp/laravel-split
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force

      - name: Trigger Packagist update for rabbit-rs-laravel
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.has_packagist == 'true'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=goopil&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs-laravel"}}'

      - name: Summary
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::Split completed locally but push was skipped."
          echo "::notice::Configure MIRROR_TOKEN and PACKAGIST_TOKEN secrets to enable mirror push."
