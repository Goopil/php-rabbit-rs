name: Functional matrix

# Closes the gap between the distribution matrix (PHP 8.4/8.5 x glibc/musl
# x x86_64/arm64 + macOS ARM64) and the functional one: every distribution
# cell gets real-broker coverage — load + publish/confirm + consume/ack +
# one Toxiproxy outage/recovery scenario via scripts/amqp-smoke.sh (issue
# #227). Nightly, on dispatch, and callable from other workflows.

on:
  schedule:
    # Nightly, UTC — offset from the soak's `7 2 * * *` so the two never
    # contend for the lab images at the same minute.
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: functional-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PHP 8.5 glibc x86_64: the same full integration bar CI's `integration`
  # job runs on PHP 8.4 (Rust integration suites + Laravel integration
  # suite), on the PHP version real-broker CI does not cover.
  integration-php85:
    name: PHP 8.5 glibc x86_64 (full integration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.96
        uses: ./.github/actions/rust-setup

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.5"
          coverage: none
          extensions: json

      - name: Install jq (lab readiness checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Build PHP extension (release)
        run: cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh >/dev/null 2>&1; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: AMQP smoke (publish/confirm, consume, outage/recovery)
        run: ./scripts/amqp-smoke.sh --php php --ext "$(pwd)/target/release/librabbit_rs_php.so"

      - name: Run full integration suites (fresh lab)
        run: ./scripts/test-integration.sh

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh || true

  # Distribution cells CI never touches: the extension is built inside the
  # same digest-pinned PHP images the release pipeline ships from, then the
  # smoke runs against the runner-hosted lab through the host gateway.
  docker-smoke:
    name: PHP 8.4 ${{ matrix.libc }} ${{ matrix.arch }} (smoke)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: musl
            # Digest-pinned multi-arch index, same pin as release.yml build-linux (8.4-musl).
            image: php@sha256:2f389f933c3cc58cc622bd243bb4ecff7e6553e2de4387a239bca640c988be19
          - arch: arm64
            libc: musl
            image: php@sha256:2f389f933c3cc58cc622bd243bb4ecff7e6553e2de4387a239bca640c988be19
          - arch: arm64
            libc: glibc
            # Digest-pinned multi-arch index, same pin as release.yml build-linux (8.4-glibc).
            image: php@sha256:a545b9041fb0e378cb597b4d0509f77c6a4d996dd485763af92e5b7e59c469cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh >/dev/null 2>&1; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: Build extension and run AMQP smoke in Docker
        run: |
          # host.docker.internal:host-gateway points the container at the
          # runner host, where the lab publishes AMQP (5672), the Toxiproxy
          # API (18474) and the per-test proxy range (24504-24509).
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ matrix.image }} \
            sh -c '
              set -e
              if [ "${{ matrix.libc }}" = "musl" ]; then
                apk add --no-cache curl gcc g++ make pkgconfig clang-dev musl-dev linux-headers
                RUSTUP_FLAGS="--default-toolchain stable --profile minimal"
              else
                apt-get update && apt-get install -y curl gcc make libclang-dev
                RUSTUP_FLAGS=""
              fi
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y $RUSTUP_FLAGS
              . "$HOME/.cargo/env"
              if [ "${{ matrix.libc }}" = "musl" ]; then
                RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              else
                cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml
              fi
              ./scripts/amqp-smoke.sh \
                --php php \
                --ext /src/target/release/librabbit_rs_php.so \
                --dsn host.docker.internal:5672 \
                --toxiproxy http://host.docker.internal:18474
            '

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh || true

  # macOS ARM64 has no PIE install path (Homebrew instead) and no Docker on
  # the runner, so there is no lab or Toxiproxy: this cell proves load +
  # publish/confirm + consume/ack against a local rabbitmq from Homebrew,
  # without the recovery scenario. Gated to dispatch/call — RC-only cost,
  # never burn nightly minutes on it.
  macos-arm64:
    name: PHP 8.4 macOS ARM64 (smoke, no broker chaos)
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"

      - name: Build extension
        run: cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml

      - name: Start local RabbitMQ (Homebrew)
        run: |
          brew install rabbitmq
          export PATH="/opt/homebrew/sbin:$PATH"
          rabbitmq-server -detached
          rabbitmqctl await_startup
          # Mirror the lab's least-privilege identity: bench.* queue names on
          # the default vhost, matching scripts/amqp-smoke defaults.
          rabbitmqctl add_user rabbit_rs rabbit_rs_lab
          rabbitmqctl set_permissions -p / rabbit_rs "^(amq\.|bench\.|benchmark_)" ".*" ".*"

      - name: AMQP smoke (no recovery scenario — no Toxiproxy on macOS runners)
        run: |
          export PATH="/opt/homebrew/sbin:$PATH"
          ./scripts/amqp-smoke.sh \
            --php php \
            --ext "$(pwd)/target/release/librabbit_rs_php.dylib" \
            --skip-recovery

      - name: Stop RabbitMQ
        if: always()
        run: |
          export PATH="/opt/homebrew/sbin:$PATH"
          rabbitmqctl stop || true
