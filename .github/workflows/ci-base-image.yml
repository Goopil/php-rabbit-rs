name: CI base image

# Builds and publishes the ghcr.io/goopil/php-rs-ci:{php}-{flavor} images used
# by the PHPT and FPM certification jobs in ci.yml. Runs when the Dockerfile
# changes or on demand; the jobs pull the latest published tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/docker/ci-base.Dockerfile]
  pull_request:
    paths: [.github/docker/ci-base.Dockerfile]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-base-image
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.php }}-${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", flavor: cli }
          - { php: "8.5", flavor: cli }
          - { php: "8.4", flavor: fpm }
          - { php: "8.5", flavor: fpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        # PRs from forks cannot push to GHCR: build only (validates the
        # Dockerfile), the push happens on main.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/docker/ci-base.Dockerfile
          push: true
          tags: ghcr.io/goopil/php-rs-ci:${{ matrix.php }}-${{ matrix.flavor }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_FLAVOR=${{ matrix.flavor }}
          cache-from: type=gha,scope=base-${{ matrix.php }}-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.php }}-${{ matrix.flavor }}
