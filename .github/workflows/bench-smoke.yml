name: Benchmark Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run native benchmarks (minimal samples)
        run: |
          cargo bench -p rabbit-rs-native-bench --bench batching -- --sample-size 10 --warm-up-time 1 --measurement-time 2
          cargo bench -p rabbit-rs-native-bench --bench ffi_conversion -- --sample-size 10 --warm-up-time 1 --measurement-time 2
          cargo bench -p rabbit-rs-native-bench --bench scheduler -- --sample-size 10 --warm-up-time 1 --measurement-time 2
          cargo bench -p rabbit-rs-native-bench --bench transport -- --sample-size 10 --warm-up-time 1 --measurement-time 2

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: native-bench-results
          path: target/criterion/
          retention-days: 7

  laravel-comparison-smoke:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: json, mbstring

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and install extension
        run: ./scripts/install.sh --release --yes

      - name: Verify extension is loaded
        run: |
          if ! php -m 2>/dev/null | grep -q rabbit_rs; then
            echo "ERROR: ext-rabbit_rs is not loaded after install"
            exit 1
          fi

      - name: Install Laravel package dependencies
        run: |
          cd packages/laravel-queue
          composer install --quiet --ignore-platform-reqs

      - name: Run Laravel comparison smoke
        run: |
          cd benchmarks/laravel
          ./scripts/run-matrix.sh --smoke || true

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: laravel-comparison-smoke-results
          path: benchmarks/laravel/results/
          retention-days: 7
