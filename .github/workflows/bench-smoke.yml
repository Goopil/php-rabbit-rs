name: Benchmark Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: json

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Build PHP extension
        run: cargo build --release --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Install extension
        run: ./scripts/install.sh --release --yes

      - name: Start RabbitMQ lab
        run: ./scripts/lab-up.sh with-plugin

      - name: Wait for lab readiness
        run: |
          for i in $(seq 1 120); do
            if ./scripts/lab-ready.sh; then
              echo "Lab is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Lab did not become ready after 120s." >&2
          exit 1

      - name: Run smoke benchmark
        run: php benchmarks/smoke.php

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-results
          path: benchmarks/results/
          retention-days: 7

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh
