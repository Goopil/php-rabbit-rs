name: Nightly

on:
  schedule:
    # 03:15 UTC daily — off-hours for EU and US West.
    - cron: "15 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real-server Octane certification (issue #226, decision D1): every server
  # in the v1 contract runs the full publish -> reload -> graceful stop ->
  # no-loss -> drain scenario against the RabbitMQ lab through
  # scripts/test-octane-runtime.sh. RoadRunner additionally runs on every PR
  # (ci.yml, octane-runtime job).
  octane-runtime:
    name: Octane runtime (${{ matrix.server }})
    # libclang 21 on ubuntu-latest (26.04) breaks ext-php-rs 0.15's bindgen; unpin after the ext-php-rs 0.16 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [roadrunner, frankenphp, swoole, openswoole]
        include:
          # Swoole-family servers need the matching PHP extension; RoadRunner
          # and FrankenPHP get the native extension from the repo build (RR)
          # or from the in-image ZTS build (FrankenPHP, see the harness).
          - server: roadrunner
            php-extensions: curl
          - server: frankenphp
            php-extensions: curl
          - server: swoole
            php-extensions: curl, swoole
          - server: openswoole
            php-extensions: curl, openswoole
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.98
        uses: ./.github/actions/rust-setup

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none
          extensions: ${{ matrix.php-extensions }}

      - name: Build PHP extension
        run: cargo build --manifest-path crates/rabbit-rs-php/Cargo.toml --features extension-tests

      - name: Run real-server Octane certification
        run: ./scripts/test-octane-runtime.sh --server=${{ matrix.server }}
