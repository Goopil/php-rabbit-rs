name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  chaos:
    name: Chaos tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run chaos tests
        run: ./scripts/test-chaos.sh

      - name: Stop RabbitMQ lab
        if: always()
        run: ./scripts/lab-down.sh
