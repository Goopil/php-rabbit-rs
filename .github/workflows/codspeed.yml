name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows CodSpeed to trigger backtest performance analysis.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Rust benchmarks
    runs-on: ubuntu-latest
    env:
      # The ubuntu-26.04 image ships libclang 20/21/22; clang-sys picks the
      # newest (22), whose parser no longer knows LLVM <=21's
      # __builtin_ia32_* builtins, so parsing the PHP headers fails the
      # ext-php-rs build. Pin the library to 21, whose headers the runner's
      # PHP toolchain resolves against (probed on 2026-10-24).
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.98
        uses: ./.github/actions/rust-setup

      # The rabbit-rs-php bench compiles against ext-php-rs, which needs the
      # PHP headers and libclang for bindgen (same setup as the coverage job).
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked --quiet || true

      - name: Build the benchmark targets
        run: cargo codspeed build --workspace --features rabbit-rs-core/bench,rabbit-rs-php/bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run
