name: Split Laravel Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: split-laravel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check prerequisites
        id: check
        run: |
          if [[ -z "${{ secrets.MIRROR_TOKEN }}" ]]; then
            echo "::warning::MIRROR_TOKEN secret is not configured — skipping push to mirror"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split Laravel package
        run: |
          ./scripts/split-laravel-package.sh --output /tmp/laravel-split

      - name: Push to mirror repository
        if: steps.check.outputs.skip == 'false'
        run: |
          cd /tmp/laravel-split
          git init
          git checkout -b main
          git add -A
          git commit -m "Release ${GITHUB_REF_NAME}"
          git remote add origin "https://${{ secrets.MIRROR_TOKEN }}@github.com/Goopil/rabbit-rs-laravel.git"
          git push origin main --force

      - name: Tag the mirror
        if: steps.check.outputs.skip == 'false'
        run: |
          cd /tmp/laravel-split
          git tag "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Trigger Packagist update for rabbit-rs-laravel
        if: steps.check.outputs.skip == 'false' && ${{ secrets.PACKAGIST_TOKEN != '' }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -H "X-Packagist-Token: ${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs-laravel"}}'

      - name: Trigger Packagist update for rabbit-rs-native
        if: steps.check.outputs.skip == 'false' && ${{ secrets.PACKAGIST_TOKEN != '' }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -H "X-Packagist-Token: ${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/Goopil/rabbit-rs"}}'

      - name: Summary
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::Split completed locally but push was skipped."
          echo "::notice::Configure MIRROR_TOKEN and PACKAGIST_TOKEN secrets to enable mirror push."
