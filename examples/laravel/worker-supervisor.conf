# Supervisor configuration for Rabbit RS workers.
#
# Install Supervisor: apt-get install supervisor
# Copy to /etc/supervisor/conf.d/rabbit-rs-worker.conf
# Update: supervisorctl reread && supervisorctl update
# Start: supervisorctl start rabbit-rs-worker
# Status: supervisorctl status rabbit-rs-worker
# Stop: supervisorctl stop rabbit-rs-worker

[program:rabbit-rs-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan rabbit-rs:work --workers=2 --queue=main --max-restarts=0
directory=/var/www/html
user=www-data
group=www-data
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true

# Logging
redirect_stderr=true
stdout_logfile=/var/log/rabbit-rs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# Number of supervisor processes (each runs its own rabbit-rs:work supervisor)
numprocs=1
