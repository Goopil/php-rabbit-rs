name: rabbitrs

x-rabbitmq-with-plugin: &rabbitmq-with-plugin
  build:
    context: ./rabbitmq
    dockerfile: Dockerfile
  environment: &rabbitmq-env
    RABBITMQ_ERLANG_COOKIE: "rabbit_rs_lab_cluster_cookie"
  configs:
    - source: rabbitmq_conf
      target: /etc/rabbitmq/rabbitmq.conf
    - source: rabbitmq_definitions
      target: /etc/rabbitmq/definitions.json
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s
  restart: unless-stopped

x-rabbitmq-without-plugin: &rabbitmq-without-plugin
  build:
    context: ./rabbitmq
    dockerfile: Dockerfile.no-plugin
  environment: *rabbitmq-env
  configs:
    - source: rabbitmq_conf_no_plugin
      target: /etc/rabbitmq/rabbitmq.conf
    - source: rabbitmq_definitions
      target: /etc/rabbitmq/definitions.json
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s
  restart: unless-stopped

services:
  rabbitmq-1:
    profiles: ["with-plugin"]
    <<: *rabbitmq-with-plugin
    hostname: rabbitmq-1
    ports:
      - "15672:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-1"

  rabbitmq-2:
    profiles: ["with-plugin"]
    <<: *rabbitmq-with-plugin
    hostname: rabbitmq-2
    ports:
      - "15673:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-2"
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  rabbitmq-3:
    profiles: ["with-plugin"]
    <<: *rabbitmq-with-plugin
    hostname: rabbitmq-3
    ports:
      - "15674:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-3"
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  rabbitmq-1-np:
    profiles: ["without-plugin"]
    <<: *rabbitmq-without-plugin
    hostname: rabbitmq-1
    ports:
      - "15672:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-1"

  rabbitmq-2-np:
    profiles: ["without-plugin"]
    <<: *rabbitmq-without-plugin
    hostname: rabbitmq-2
    ports:
      - "15673:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-2"
    depends_on:
      rabbitmq-1-np:
        condition: service_healthy

  rabbitmq-3-np:
    profiles: ["without-plugin"]
    <<: *rabbitmq-without-plugin
    hostname: rabbitmq-3
    ports:
      - "15674:15672"
    environment:
      <<: *rabbitmq-env
      RABBITMQ_NODENAME: "rabbit@rabbitmq-3"
    depends_on:
      rabbitmq-1-np:
        condition: service_healthy

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    hostname: toxiproxy
    ports:
      - "8474:8474"
      - "5672:5672"
      - "5673:5673"
      - "5674:5674"
    volumes:
      - toxiproxy_config_vol:/config:ro
    command: ["-host=0.0.0.0", "-config=/config/config.json"]
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy

  toxiproxy-np:
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    hostname: toxiproxy
    profiles: ["without-plugin"]
    ports:
      - "8474:8474"
      - "5672:5672"
      - "5673:5673"
      - "5674:5674"
    volumes:
      - toxiproxy_config_vol:/config:ro
    command: ["-host=0.0.0.0", "-config=/config/config.json"]
    depends_on:
      rabbitmq-1-np:
        condition: service_healthy
      rabbitmq-2-np:
        condition: service_healthy
      rabbitmq-3-np:
        condition: service_healthy

  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    hostname: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy

  prometheus-np:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    hostname: prometheus
    profiles: ["without-plugin"]
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      rabbitmq-1-np:
        condition: service_healthy
      rabbitmq-2-np:
        condition: service_healthy
      rabbitmq-3-np:
        condition: service_healthy

configs:
  rabbitmq_conf:
    file: ./rabbitmq/rabbitmq.conf
  rabbitmq_conf_no_plugin:
    file: ./rabbitmq/rabbitmq-no-plugin.conf
  rabbitmq_definitions:
    file: ./rabbitmq/definitions.json

volumes:
  toxiproxy_config_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TOXIPROXY_CONFIG_DIR:-./toxiproxy}
