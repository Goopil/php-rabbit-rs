loopback_users.guest = false

listeners.tcp.default = 5672

management.listener.ip = 0.0.0.0
management.listener.port = 15672

prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = true

cluster_partition_handling = pause_minority

disk_free_limit.absolute = 512MB

log.console = true
log.console.level = info

quorum_queue.commands_soft_limit = 256

cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Credentials imported from definitions.json (rabbit_rs_lab, admin_lab) are local
# lab-only values, not production secrets. S2068 is a false positive for this fixture.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
