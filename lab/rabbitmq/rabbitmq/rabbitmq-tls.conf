# TLS profile configuration: the node serves AMQP over TLS only (amqps).
# Certificates are bind-mounted at /etc/rabbitmq/tls by compose.yaml and
# generated at lab-up time by ./tls/generate.sh.

listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/lab-ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false

management.listener.ip = 0.0.0.0
management.listener.port = 15672

log.console = true
log.console.level = info

definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
