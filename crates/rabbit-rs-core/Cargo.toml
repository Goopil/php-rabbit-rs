[package]
name = "rabbit-rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []
integration = []
bench = []

[dependencies]
arc-swap = "1"
async-trait = "0.1"
bytes = "1.10"
crossbeam-queue = "0.3"
fastrand = "2.3"
flume = "0.11"
futures-lite = "2.6"
futures-util = "0.3"
lapin = { version = "4.10", default-features = false, features = ["rustls--ring", "rustls-platform-verifier", "tokio"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["test-util", "process"] }

[[bench]]
name = "batching"
path = "benches/batching.rs"
harness = false

[[bench]]
name = "confirm_ledger"
path = "benches/confirm_ledger.rs"
harness = false

[[bench]]
name = "ffi_conversion"
path = "benches/ffi_conversion.rs"
harness = false

[[bench]]
name = "lapin_properties"
path = "benches/lapin_properties.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "publisher_actor"
path = "benches/publisher_actor.rs"
harness = false

[[bench]]
name = "scheduler"
path = "benches/scheduler.rs"
harness = false

[[bench]]
name = "transport"
path = "benches/transport.rs"
harness = false

[[test]]
name = "chaos_reconnect"
path = "tests/chaos/reconnect.rs"

[lints]
workspace = true
