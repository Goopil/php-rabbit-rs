[package]
name = "rabbit-rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Benchmark targets are declared explicitly: benches/support.rs is a shared
# fixture module, not a benchmark binary.
autobenches = false

[features]
test-support = []
integration = []
# Gates the benchmark targets: they use a custom harness that the nextest
# runner (`--all-targets`) cannot drive, so they stay out of the test build.
bench = []

[dependencies]
async-trait = "0.1"
bytes = "1.10"
flume = "0.12"
fastrand = "2.3"
futures-util = "0.3"
lapin = { version = "4.10", default-features = false, features = ["rustls--ring", "rustls-platform-verifier", "tokio"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["test-util", "process"] }
rabbit-rs-core = { path = ".", features = ["test-support"] }
proptest = "1.8"
proptest-state-machine = "0.8"
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[[bench]]
name = "config"
harness = false
required-features = ["bench"]

[[bench]]
name = "consumer"
harness = false
required-features = ["bench"]

[[bench]]
name = "topology"
harness = false
required-features = ["bench"]

[[bench]]
name = "publisher"
harness = false
required-features = ["bench"]

[[bench]]
name = "consumer_delivery"
harness = false
required-features = ["bench"]

[lints]
workspace = true
