[global]
pid = ${RABBIT_RS_FPM_PID}
error_log = ${RABBIT_RS_FPM_LOG}
daemonize = no
; Graceful-stop certification: give in-flight requests time to finish when
; the master signals the workers (SIGQUIT stop, SIGUSR2 reload).
process_control_timeout = 10s

[rabbit-rs]
user = ${RABBIT_RS_FPM_USER}
group = ${RABBIT_RS_FPM_GROUP}
listen = ${RABBIT_RS_FPM_SOCKET}
listen.mode = 0600
pm = static
pm.max_children = 2
catch_workers_output = yes
clear_env = no
security.limit_extensions = .php