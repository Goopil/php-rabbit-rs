[package]
name = "rabbit-rs-php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
extension-tests = ["rabbit-rs-core/test-support"]

[dependencies]
bytes = "1.10"
ext-php-rs = "=0.15.15"
rabbit-rs-core = { path = "../rabbit-rs-core" }
serde_json = "1.0"
tokio = { version = "1.47", features = ["time"] }

[dev-dependencies]
rabbit-rs-core = { path = "../rabbit-rs-core", features = ["test-support"] }
proptest = "1.8"
proptest-state-machine = "0.4"
zend-link-stubs = { path = "zend-link-stubs" }

[lints]
workspace = true
