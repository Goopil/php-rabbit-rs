[package]
name = "rabbit-rs-php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Benchmark targets are declared explicitly (see the core crate): the custom
# harness cannot be driven by nextest, and support.rs-style fixtures stay
# out of the bench binary set.
autobenches = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
extension-tests = ["rabbit-rs-core/test-support"]
# Gates the benchmark target (custom harness, see the core crate).
bench = []

[dependencies]
bytes = "1.10"
ext-php-rs = "=0.15.15"
rabbit-rs-core = { path = "../rabbit-rs-core" }
serde_json = "1.0"
tokio = { version = "1.47", features = ["time"] }

[dev-dependencies]
rabbit-rs-core = { path = "../rabbit-rs-core", features = ["test-support"] }
proptest = "1.8"
proptest-state-machine = "0.8"
zend-link-stubs = { path = "zend-link-stubs" }
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[[bench]]
name = "publish_buffer"
harness = false
required-features = ["bench"]

[lints]
workspace = true
