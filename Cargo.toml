[workspace]
members = [
    "crates/rabbit-rs-core",
    "crates/rabbit-rs-php",
]
resolver = "2"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Goopil/rabbit-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
