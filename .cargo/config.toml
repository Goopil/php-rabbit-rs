[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--unresolved-symbols=ignore-all"]

[target.x86_64-unknown-linux-gnu.env]
# libclang 19+ parses the clang builtin SSE headers (xmmintrin.h) with an
# emulated __m128 when bindgen runs without an explicit target, failing the
# ext-php-rs build on ubuntu-26.04 runners (clang 21). bindgen appends these
# args to its clang invocation; the GNU triples keep SSE baseline on.
BINDGEN_EXTRA_CLANG_ARGS = "--target=x86_64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--unresolved-symbols=ignore-all"]

[target.aarch64-unknown-linux-gnu.env]
BINDGEN_EXTRA_CLANG_ARGS = "--target=aarch64-unknown-linux-gnu"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,--unresolved-symbols=ignore-all"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,--unresolved-symbols=ignore-all"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
